	<I DOCTYPE html>
	<html lang="en" padding="10px">
	<head>
	<meta charset•"UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=l.0">
	<title>Hotel Room Booking Form</title>
	</head>
	<body>
	<h1  align ="center">Hotel  Room Booking Form</h1>
	<form action ="#" method = "post">

		<fieldset>
			<legend>Personal Information</legend>
		
	<label for="name">Full  Name:</label>
	<input type="text" id="name" name="name" required><br><br>
	<label for="email">Email: </label>
	<input type="text" id="email" name="email" required><br><br>
	<label for="phone">Phone: </label>
	<input type="tel" id="phone" name="phone"  required><br><br>
	</fieldset>
	<br><br>
	<fieldset>
		<legend>Booking Details</legend>
	<label for="check-in">Check-in Date:</label>
	<input type="date" id="check-in" name="check-in" required><br><br>
	<label for="check-out">Check-out date:</label>
	<input type="date" id="check-out" name="check-out" placeholder="dd-mm-yyyy" required><br><br>
	<label for="guests">Number of guests</label>
	<input type="number" id="guests" name="guests" min="1" max="10" required><br><br>
	<label for="room">Room Type:</label>
	<select id="room" name ="room" required>
	<option value="Single-Room">Single Room</option>
	<option value="Double-Room">Double Room</option>
	<option value="Triple-Room">Triple Room</option>
	</select><br><br>
	</fieldset>
	<br><br>
	<fieldset>
		<legend>Additional Services</legend>
	<label for="special-requests" >Special Requests: </label><br><br>
	<textarea id="special-requests" name="special-requests" rows="4" cols="50"></textarea><br><br>
	</fieldset>
	<br><br>
	<button type = "submit">Book Now</button>
	<button type="Reset">Reset</button>
